<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coke Machine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    h1 {
      color: #fff;
      font-size: 2rem;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(220,30,30,0.7);
    }

    #score-display {
      color: #f5c518;
      font-size: 1.2rem;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    /* Button wrapper with shadow ring */
    #btn-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 60px;
    }

    #big-button {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff4444, #cc0000 60%, #7a0000);
      border: none;
      cursor: pointer;
      box-shadow:
        0 8px 0 #6a0000,
        0 12px 30px rgba(200,0,0,0.6),
        inset 0 2px 8px rgba(255,180,180,0.3);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      outline: none;
      position: relative;
      top: 0;
    }

    #big-button:hover {
      box-shadow:
        0 8px 0 #6a0000,
        0 16px 40px rgba(200,0,0,0.8),
        inset 0 2px 8px rgba(255,180,180,0.3);
      transform: scale(1.04);
    }

    #big-button:active,
    #big-button.pressed {
      transform: translateY(6px) scale(0.97);
      box-shadow:
        0 2px 0 #6a0000,
        0 4px 15px rgba(200,0,0,0.5),
        inset 0 2px 8px rgba(255,180,180,0.3);
    }

    /* Label on the button */
    #big-button::after {
      content: "PUSH";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.85);
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    /* Coke can area */
    #output {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 600px;
      padding: 0 20px;
    }

    .can {
      font-size: 3rem;
      animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      display: inline-block;
      cursor: default;
      user-select: none;
    }

    @keyframes pop-in {
      0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
      60%  { transform: scale(1.2) rotate(5deg);  opacity: 1; }
      100% { transform: scale(1) rotate(0deg);    opacity: 1; }
    }

    /* Floating text that flies up on click */
    .float-text {
      position: fixed;
      font-size: 1.4rem;
      font-weight: bold;
      color: #f5c518;
      pointer-events: none;
      animation: float-up 1.2s ease-out forwards;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      z-index: 999;
    }

    @keyframes float-up {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-120px) scale(1.3); }
    }

    /* Particle burst */
    .particle {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
      animation: burst 0.8s ease-out forwards;
      z-index: 998;
    }

    @keyframes burst {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
    }

    #message {
      margin-top: 24px;
      font-size: 1.1rem;
      color: #aaa;
      letter-spacing: 1px;
      min-height: 1.5em;
      text-align: center;
    }

    #clear-btn {
      margin-top: 16px;
      background: transparent;
      border: 1px solid #555;
      color: #888;
      padding: 6px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: border-color 0.2s, color 0.2s;
    }
    #clear-btn:hover { border-color: #aaa; color: #ccc; }
  </style>
</head>
<body>

  <h1>COKE MACHINE</h1>
  <div id="score-display">Cokes collected: <span id="count">0</span></div>

  <div id="btn-wrapper">
    <button id="big-button" aria-label="Get a Coke"></button>
  </div>

  <div id="output"></div>
  <div id="message">Press the button to get a Coke!</div>
  <button id="clear-btn">Clear tray</button>

  <script>
    const button   = document.getElementById('big-button');
    const output   = document.getElementById('output');
    const countEl  = document.getElementById('count');
    const message  = document.getElementById('message');
    const clearBtn = document.getElementById('clear-btn');

    let count = 0;

    const messages = [
      "Enjoy your Coke! 🥤",
      "Ice cold! 🧊",
      "Classic choice!",
      "You deserve it!",
      "Another one!",
      "Coke addict detected 👀",
      "Keep 'em coming!",
      "The real thing!",
      "Refreshing!",
      "You can't stop, can you?",
      "Coke #" + (count + 1) + " incoming!",
      "Unlimited Cokes! 🎉",
    ];

    const colors = ['#e63946','#f4a261','#e9c46a','#2a9d8f','#457b9d','#a8dadc','#f72585','#7209b7'];

    function spawnParticles(x, y) {
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = (i / 16) * 360;
        const dist  = 60 + Math.random() * 80;
        const rad   = angle * Math.PI / 180;
        p.style.left = x + 'px';
        p.style.top  = y + 'px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.setProperty('--tx', Math.cos(rad) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(rad) * dist + 'px');
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    }

    function spawnFloatText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'float-text';
      el.textContent = text;
      el.style.left = (x - 40) + 'px';
      el.style.top  = (y - 20) + 'px';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    button.addEventListener('click', (e) => {
      count++;
      countEl.textContent = count;

      // Add Coke can emoji
      const can = document.createElement('span');
      can.className = 'can';
      can.textContent = '🥤';
      can.title = 'Coke #' + count;
      output.appendChild(can);

      // Update message
      const msg = messages[Math.floor(Math.random() * messages.length)];
      message.textContent = msg.replace(/Coke #\d+/, 'Coke #' + count);

      // Visual effects at button center
      const rect = button.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top  + rect.height / 2;
      spawnParticles(cx, cy);
      spawnFloatText(cx, cy, '+1 🥤');

      // Press animation
      button.classList.add('pressed');
      setTimeout(() => button.classList.remove('pressed'), 150);
    });

    clearBtn.addEventListener('click', () => {
      output.innerHTML = '';
    });
  </script>
</body>
</html>
